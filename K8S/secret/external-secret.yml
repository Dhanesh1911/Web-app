apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-sa
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::161987605604:role/secret
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-store
  namespace: default
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: eso-sa
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-external
  namespace: default
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: aws-store
    kind: SecretStore
  target:
    name: db-secret
  data:
    - secretKey: username
      remoteRef:
        key: mu-key
        property: username
    - secretKey: password
      remoteRef:
        key: mu-key
        property: password