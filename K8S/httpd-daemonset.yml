apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: httpd-daemonset
  namespace: web-server
spec:
  selector:
    matchLabels:
      app: httpd-daemon
  template:
    metadata:
      labels:
        app: httpd-daemon
    spec:
      containers:
        - name: httpd
          image: httpd:2.4
          ports:
            - containerPort: 80
