apiVersion: v1
kind: Namespace
metadata:
  name: web-server
---
apiVersion: v1
kind: Pod
metadata:
  name: httpd-pod
  namespace: web-server
  labels:
    app: httpd
spec:
  containers:
    - name: httpd
      image: httpd:2.4
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: httpd-service
  namespace: web-server
spec:
  type: NodePort
  selector:
    app: httpd
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
